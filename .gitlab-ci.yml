---
# GitLab CI/CD Pipeline for wal
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.1"

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template — downloads only when not cached (PERF-0009).
# apt-get is only invoked when the Zig binary is not cached (QA-0009).
.install-zig: &install-zig
  - |
    if [ ! -f "zig-linux-x86_64-${ZIG_VERSION}/zig" ]; then
      command -v curl >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends curl xz-utils; }
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
      tar -xf zig.tar.xz
      rm zig.tar.xz
    fi
  - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
  - zig version

# Cache the Zig toolchain and build artifacts across pipeline runs (PERF-0022).
.zig-cache: &zig-cache
  cache:
    key: "zig-${ZIG_VERSION}"
    paths:
      - zig-linux-x86_64-${ZIG_VERSION}/
      - .zig-cache/

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast optimization tests (QA-0011)
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall optimization tests (QA-0046)
test-release-small:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Debug optimization tests (QA-0011)
test-debug:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=Debug --summary all
    - zig build test-integration -Doptimize=Debug --summary all
  needs:
    - build

# Fuzz tests for binary parsing entrypoints (QA-0058, SEC-0040)
test-fuzz:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-fuzz --summary all
  needs:
    - build

# Validate Makefile targets match build.zig (QA-0030)
test-makefile:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
    - command -v make >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends make; }
  script:
    # Use `make dev` (fmt+check+unit) instead of `make ci` (clean+build+all tests)
    # to avoid duplicating work already covered by dedicated CI jobs (PERF-0019).
    - make dev
  needs:
    - build

# Cross-compilation tests
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-linux
    - zig build -Dtarget=x86_64-macos
    - zig build -Dtarget=aarch64-macos
  needs:
    - build
