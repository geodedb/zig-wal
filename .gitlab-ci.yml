---
# GitLab CI/CD Pipeline for wal
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    - company
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check
    # Compile the public example so API drift in examples/basic.zig fails CI
    # rather than rotting silently (QA-0077).
    - zig build example

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
    - zig build test-fuzz -j2 --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test-fuzz --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Results are stored as artifacts for trend analysis.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  needs:
    - build

# ---------------------------------------------------------------------------
# FIPS-140-3 dual-mode test (-Dfips=true).
#
# `fips-deps` builds the latest OpenSSL 3.x + FIPS provider into
# /usr/local/ssl (via the repo `make deps` target, which the ci-catalog
# `zig-fips-build` component also provides). `test-fips` then runs the suite
# against the validated FIPS backend. Linux-only; MR + default-branch.
fips-deps:
  stage: build
  image: debian:bookworm-slim
  # Pin to x86: fips-deps hands a compiled OpenSSL to test-fips as an
  # artifact, so both jobs must run on the same CPU architecture.
  tags: [company, linux, x86]
  before_script:
    # wget + sudo + gnupg: required by scripts/install-openssl-fips.sh (copy
    # of devnw/zig/fips' script; it fetches/verifies OpenSSL via wget + gpg and
    # installs via sudo, a no-op wrapper as root in the container).
    - apt-get update && apt-get install -y --no-install-recommends build-essential perl curl wget sudo gnupg xz-utils ca-certificates
    - wget -q https://www.openssl-library.org/source/pubkeys.asc -O /tmp/openssl-pubkeys.asc
    - gpg --batch --import /tmp/openssl-pubkeys.asc
  script:
    # GitLab artifacts must live under $CI_PROJECT_DIR: /usr/local/ssl cannot
    # be uploaded, so build into a project-relative prefix. OPENSSL_VERSION is
    # pinned because the script's "latest 3.x" resolver no longer finds a 3.x
    # tag now that 4.x is the latest release (same pin as devnw/zig/fts-storage).
    - OPENSSL_PREFIX="$CI_PROJECT_DIR/.openssl-fips" OPENSSL_VERSION="3.6.5" REQUIRE_GPG=1 make deps
  artifacts:
    paths:
      - .openssl-fips/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test-fips:
  stage: test
  image: debian:bookworm-slim
  tags: [company, linux, x86]
  before_script:
    - *install-zig
  script:
    - OPENSSL_CONF="$CI_PROJECT_DIR/.openssl-fips/ssl/openssl.cnf" zig build test -Dfips=true -Dopenssl_path="$CI_PROJECT_DIR/.openssl-fips" --summary all
  needs:
    - fips-deps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
  tags: [company, linux, x86]
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

release-signature-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends gnupg
  script:
    - python3 scripts/test_release_signature.py

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

# Exercise OS entropy natively: cross-compilation cannot detect a wrong syscall.
test-portable-entropy-macos:
  stage: test
  image: macos-26-xcode-26
  tags: [saas-macos-medium-m1]
  timeout: 10m
  interruptible: true
  needs: []
  cache:
    key: "zig-${ZIG_VERSION}-macos-aarch64"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - |
      if [ ! -x "zig-${ZIG_VERSION}/zig" ] || [ "$(zig-${ZIG_VERSION}/zig version)" != "$ZIG_VERSION" ]; then
        ARCH=$(uname -m)
        case "$(uname -s)" in
          Linux) ZIG_OS=linux ;;
          Darwin) ZIG_OS=macos ;;
          *) echo "Unsupported operating system"; exit 1 ;;
        esac
        case "$ARCH" in
          x86_64)  ZIG_ARCH="x86_64" ;;
          aarch64) ZIG_ARCH="aarch64" ;;
          arm64)   ZIG_ARCH="aarch64" ;;
          *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
        MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
        if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
          ARCHIVE_NAME="zig-${ZIG_OS}-${ZIG_ARCH}-${ZIG_VERSION}"
        else
          ARCHIVE_NAME="zig-${ZIG_ARCH}-${ZIG_OS}-${ZIG_VERSION}"
        fi
        TARBALL="${ARCHIVE_NAME}.tar.xz"
        INDEX_FILE=$(mktemp)
        curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
        EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-${ZIG_OS}" ZIG_IDX="${INDEX_FILE}" \
          python3 -c "
      import json, os, sys
      idx = json.load(open(os.environ['ZIG_IDX']))
      pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
      h = pkg.get('shasum', '')
      if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
      print(h)
      ")
        rm -f "${INDEX_FILE}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
        ZIG_ARCHIVE="${TARBALL}" ZIG_SHA256="${EXPECTED_HASH}" python3 -c 'import hashlib, os; p=os.environ["ZIG_ARCHIVE"]; actual=hashlib.sha256(open(p, "rb").read()).hexdigest(); assert actual == os.environ["ZIG_SHA256"], "Zig archive checksum mismatch"'
        tar -xJf "${TARBALL}"
        rm -rf "zig-${ZIG_VERSION}"
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
        rm -f "${TARBALL}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - zig test -lc --dep std_shim -Mroot=tests/portable_entropy_test.zig -Mstd_shim=src/std_shim.zig
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
